# Deployed by Ansible.
# Do not edit manually, changes will be overwritten.
#
# Enable WireGuard-based transparent encryption for all pod-to-pod traffic.

apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: rke2-cilium
  namespace: kube-system
spec:
  valuesContent: |-
    encryption:
      enabled: true
      type: wireguard
    hostFirewall:
      enabled: true
