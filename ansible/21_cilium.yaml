---
- name: Deploy Cilium
  hosts: k8s_master_nodes[0]
  gather_facts: false

  vars:
    ansible_host: "{{ node_private_ip }}"
    ansible_user: "{{ ssh_user }}"

  tasks:
    # See the link below (depending on the Cilium version) for required Gateway API CRDs:
    # https://docs.cilium.io/en/stable/network/servicemesh/gateway-api/gateway-api/#prerequisites
    # https://docs.cilium.io/en/latest/network/servicemesh/gateway-api/gateway-api/#prerequisites
    - name: Apply Gateway API CRDs
      ansible.builtin.command:
        cmd: "kubectl apply -f {{ item }}"
      loop:
        # Cilium 1.19
        # - https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.4.1/config/crd/standard/gateway.networking.k8s.io_gatewayclasses.yaml
        # - https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.4.1/config/crd/standard/gateway.networking.k8s.io_gateways.yaml
        # - https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.4.1/config/crd/standard/gateway.networking.k8s.io_httproutes.yaml
        # - https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.4.1/config/crd/standard/gateway.networking.k8s.io_referencegrants.yaml
        # - https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.4.1/config/crd/standard/gateway.networking.k8s.io_grpcroutes.yaml
        # Cilium 1.20
        - https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.5.1/config/crd/standard/gateway.networking.k8s.io_gatewayclasses.yaml
        - https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.5.1/config/crd/standard/gateway.networking.k8s.io_gateways.yaml
        - https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.5.1/config/crd/standard/gateway.networking.k8s.io_httproutes.yaml
        - https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.5.1/config/crd/standard/gateway.networking.k8s.io_referencegrants.yaml
        - https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.5.1/config/crd/standard/gateway.networking.k8s.io_grpcroutes.yaml
        - https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.5.1/config/crd/standard/gateway.networking.k8s.io_backendtlspolicies.yaml
        - https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.5.1/config/crd/standard/gateway.networking.k8s.io_tlsroutes.yaml
      when: not ansible_check_mode
      register: crd_apply_result
      changed_when: "'unchanged' not in crd_apply_result.stdout"

    - name: Render Cilium values file
      ansible.builtin.template:
        src: cilium-values.yaml.j2
        dest: /tmp/cilium-values.yaml
        mode: "0644"

    - name: Ensure cilium namespace exists
      ansible.builtin.command:
        cmd: kubectl create namespace cilium
      register: create_ns
      failed_when: create_ns.rc != 0 and 'AlreadyExists' not in create_ns.stderr
      changed_when: create_ns.rc == 0

    - name: Label cilium namespace for privileged Pod Security
      ansible.builtin.command:
        cmd: >-
          kubectl label namespace cilium --overwrite
          pod-security.kubernetes.io/enforce=privileged
          pod-security.kubernetes.io/audit=privileged
          pod-security.kubernetes.io/warn=privileged
      register: label_ns
      changed_when: "'not labeled' not in label_ns.stdout"

    # Stable: 1.19.5
    # Latest: 1.20.0-pre.3
    - name: Install Cilium via Helm
      ansible.builtin.command:
        cmd: >-
          helm upgrade --install cilium oci://quay.io/cilium/charts/cilium
          --version 1.20.0-pre.3
          --namespace cilium
          --wait
          --timeout 10m
          -f /tmp/cilium-values.yaml
      when: not ansible_check_mode
      register: cilium_helm_result
      changed_when: "'has been upgraded' in cilium_helm_result.stdout or 'has been installed' in cilium_helm_result.stdout"
