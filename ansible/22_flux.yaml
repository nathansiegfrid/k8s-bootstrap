---
- name: Deploy Flux Operator and Flux Instance
  hosts: k8s_master_nodes[0]

  vars:
    ansible_host: "{{ node_private_ip }}"
    ansible_user: "{{ ssh_user }}"

  tasks:
    - name: Confirm Flux deployment
      ansible.builtin.pause:
        prompt: >-
          WARNING: This will deploy Flux Operator version '{{ flux_operator_version }}'
          and Flux Instance version '{{ flux_instance_version }}'.
          Type 'deploy' to proceed
      register: confirmation
      run_once: true
      when: not ansible_check_mode

    - name: Assert user confirmation
      ansible.builtin.assert:
        that:
          - confirmation.user_input == "deploy"
        fail_msg: "Deploy aborted."
        success_msg: "Deploy confirmed."
      run_once: true
      when: not ansible_check_mode

    - name: Install Flux Operator via Helm
      ansible.builtin.command:
        cmd: >-
          helm upgrade --install flux-operator
          oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
          --version {{ flux_operator_version }}
          --namespace flux-system
          --create-namespace
          --wait
          --timeout 5m
          --set multitenancy.enabled=true
          --set multitenancy.defaultServiceAccount=flux-operator
      when: not ansible_check_mode

    - name: Collect GitHub known_hosts entry
      ansible.builtin.command:
        cmd: ssh-keyscan github.com
      delegate_to: localhost
      become: false
      when:
        - flux_deploy_key | length > 0
        - not ansible_check_mode
      register: github_known_hosts
      changed_when: false

    - name: Set flux_known_hosts
      ansible.builtin.set_fact:
        flux_known_hosts: "{{ github_known_hosts.stdout }}"
      when:
        - flux_deploy_key | length > 0
        - not ansible_check_mode

    - name: Apply SSH pull secret
      ansible.builtin.shell:
        cmd: kubectl apply -f -
        stdin: "{{ lookup('template', 'flux-secret.yaml.j2') }}"
      when:
        - flux_deploy_key | length > 0
        - not ansible_check_mode

    - name: Remove flux-system SSH pull secret
      ansible.builtin.command:
        cmd: kubectl delete secret flux-system -n flux-system --ignore-not-found
      when:
        - flux_deploy_key | length == 0
        - not ansible_check_mode

    - name: Apply FluxInstance
      ansible.builtin.shell:
        cmd: kubectl apply -f -
        stdin: "{{ lookup('template', 'flux-instance.yaml.j2') }}"
      when: not ansible_check_mode
