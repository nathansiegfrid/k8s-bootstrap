---
- name: Destroy RKE2 cluster
  hosts: k8s_nodes
  gather_facts: false
  become: true
  vars:
    ansible_host: "{{ wireguard_ip }}"
    ansible_user: "{{ ssh_user }}"

  tasks:
    - name: Confirm cluster destruction
      ansible.builtin.pause:
        prompt:
          "DANGER: This will PERMANENTLY DESTROY the cluster on all nodes. Type
          'destroy-cluster' to proceed"
      register: confirmation
      run_once: true

    - name: Validate confirmation
      ansible.builtin.fail:
        msg: "Cluster destruction aborted."
      when: confirmation.user_input != "destroy-cluster"
      run_once: true

    - name: Run RKE2 uninstall script
      ansible.builtin.command:
        cmd: /usr/local/bin/rke2-uninstall.sh
      when: not ansible_check_mode
      failed_when: false
