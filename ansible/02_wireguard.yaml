---
# Deploy a full-mesh WireGuard VPN between all nodes.
#
# Nodes may live on different providers with no shared private network.
# WireGuard creates encrypted tunnels so inter-node traffic stays private.

- name: Deploy WireGuard mesh VPN
  hosts: k8s_nodes
  gather_facts: false
  become: true

  vars:
    ansible_host: "{{ node_public_ip }}"
    ansible_user: "{{ ssh_user }}"

  pre_tasks:
    - name: Check if WireGuard IP is reachable
      ansible.builtin.wait_for:
        host: "{{ node_private_ip }}"
        port: 22
        timeout: 3
      delegate_to: localhost
      become: false
      register: wg_reachable
      failed_when: false

    - name: Prefer WireGuard IP when reachable
      ansible.builtin.set_fact:
        ansible_host: "{{ node_private_ip }}"
      when: wg_reachable.state is defined and wg_reachable.state == "started"

    - name: Show selected connection target
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: ({{ ansible_host }})"

  tasks:
    - name: Install WireGuard
      ansible.builtin.apt:
        name:
          - iptables
          - wireguard
          - wireguard-tools
        state: present
        update_cache: true

    - name: Load WireGuard kernel module
      community.general.modprobe:
        name: wireguard
        state: present

    - name: Persist WireGuard kernel module across reboots
      ansible.builtin.copy:
        dest: /etc/modules-load.d/wireguard.conf
        content: "wireguard\n"
        mode: "0644"

    - name: Create WireGuard config directory
      ansible.builtin.file:
        path: "{{ wireguard_dir }}"
        state: directory
        mode: "0700"

    - name: Check if private key already exists
      ansible.builtin.stat:
        path: "{{ wireguard_dir }}/private.key"
      register: wg_private_key_file

    - name: Generate WireGuard private key
      ansible.builtin.shell:
        cmd: "wg genkey > {{ wireguard_dir }}/private.key"
      args:
        creates: "{{ wireguard_dir }}/private.key"
      when:
        - not wg_private_key_file.stat.exists
        - not ansible_check_mode

    - name: Set private key file permissions
      ansible.builtin.file:
        path: "{{ wireguard_dir }}/private.key"
        mode: "0600"

    - name: Check if public key already exists
      ansible.builtin.stat:
        path: "{{ wireguard_dir }}/public.key"
      register: wg_public_key_file

    - name: Generate WireGuard public key
      ansible.builtin.shell:
        cmd: "wg pubkey < {{ wireguard_dir }}/private.key > {{ wireguard_dir }}/public.key"
      when:
        - not wg_public_key_file.stat.exists
        - not ansible_check_mode

    - name: Read private key
      ansible.builtin.slurp:
        src: "{{ wireguard_dir }}/private.key"
      register: wg_private_key

    - name: Read public key
      ansible.builtin.slurp:
        src: "{{ wireguard_dir }}/public.key"
      register: wg_public_key

    - name: Store keys as host facts
      ansible.builtin.set_fact:
        wireguard_private_key: "{{ wg_private_key.content | b64decode | trim }}"
        wireguard_public_key: "{{ wg_public_key.content | b64decode | trim }}"

    - name: Write WireGuard interface config
      ansible.builtin.template:
        src: wireguard.conf.j2
        dest: "{{ wireguard_dir }}/{{ wireguard_interface }}.conf"
        owner: root
        group: root
        mode: "0600"
      register: wg_config

    - name: Enable and start WireGuard interface
      ansible.builtin.systemd_service:
        name: "wg-quick@{{ wireguard_interface }}"
        state: "{{ 'started' if ansible_host == node_private_ip else 'restarted' }}"
        enabled: true
        daemon_reload: true

    - name: Reload WireGuard config
      ansible.builtin.shell:
        cmd: "wg syncconf {{ wireguard_interface }} <(wg-quick strip {{ wireguard_interface }})"
        executable: /bin/bash
      when: wg_config.changed

    - name: Wait for WireGuard interface to be ready
      ansible.builtin.command:
        cmd: "wg show {{ wireguard_interface }}"
      register: wg_check
      until: wg_check.rc == 0
      retries: 5
      delay: 3
      changed_when: false

    - name: Show WireGuard status
      ansible.builtin.command:
        cmd: "wg show {{ wireguard_interface }}"
      register: wg_status
      changed_when: false

    - name: Print WireGuard status
      ansible.builtin.debug:
        msg: "{{ wg_status.stdout_lines }}"

    - name: Ping all peers over WireGuard
      ansible.builtin.command:
        cmd: "ping -c 3 -W 5 {{ hostvars[item].node_private_ip }}"
      loop: "{{ groups['k8s_nodes'] | difference([inventory_hostname]) }}"
      register: ping_results
      failed_when: ping_results.rc != 0
      changed_when: false

    - name: Print peer connectivity results
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} -> {{ item.item }} ({{ hostvars[item.item].node_private_ip }}): OK"
      loop: "{{ ping_results.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Generate client configs
      ansible.builtin.template:
        src: wireguard-client.conf.j2
        dest: "./generate/{{ item.name }} - {{ now(fmt='%Y%m%d') }}.conf"
        mode: "0600"
      delegate_to: localhost
      become: false
      run_once: true
      loop: "{{ wireguard_extra_peers | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
