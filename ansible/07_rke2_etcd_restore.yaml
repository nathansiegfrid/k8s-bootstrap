    #         exit 0
    #       fi
    #       if ! kill -0 "${RKE2_PID}" 2>/dev/null; then
    #         echo "ERROR: rke2 process exited unexpectedly"
    #         cat {{ restore_log }}
    #         exit 1
    #       fi
    #     done
    #     echo "ERROR: Restore did not complete within {{ restore_timeout_seconds }} seconds"
    #     kill "${RKE2_PID}" 2>/dev/null
    #     cat {{ restore_log }}
    #     exit 1
    #   when: not ansible_check_mode

    - name: Display restore output
      ansible.builtin.debug:
        msg: "{{ restore_result.stdout_lines | default([]) }}"

    - name: Display restore log
      ansible.builtin.command:
        cmd: cat {{ restore_log }}
      changed_when: false
      failed_when: false
      register: restore_log_content
      when: not ansible_check_mode

    - name: Print restore log
      ansible.builtin.debug:
        msg: "{{ restore_log_content.stdout_lines | default([]) }}"
      when: not ansible_check_mode

    # NOTE: This task is no longer necessary. Kept for documentation.
    #
    # `rke2 server --cluster-reset` generates fresh TLS CAs on disk before applying the snapshot.
    # These files will be newer than the restored etcd datastore, causing RKE2 to refuse to start.
    # Remove them so they are recreated from the datastore on the first normal start.
    #
    # May 23 19:58:23 master-id04 rke2[93371]: time="2026-05-23T19:58:23+07:00"
    # level=fatal msg="/var/lib/rancher/rke2/server/cred/ipsec.psk,
    # /var/lib/rancher/rke2/server/tls/request-header-ca.crt,
    # /var/lib/rancher/rke2/server/tls/etcd/peer-ca.crt,
    # /var/lib/rancher/rke2/server/tls/server-ca.key,
    # /var/lib/rancher/rke2/server/tls/service.key,
    # /var/lib/rancher/rke2/server/tls/client-ca.crt,
    # /var/lib/rancher/rke2/server/tls/etcd/server-ca.crt,
    # /var/lib/rancher/rke2/server/tls/server-ca.crt,
    # /var/lib/rancher/rke2/server/tls/etcd/peer-ca.key,
    # /var/lib/rancher/rke2/server/cred/encryption-config.json,
    # /var/lib/rancher/rke2/server/cred/encryption-state.json,
    # /var/lib/rancher/rke2/server/tls/request-header-ca.key,
    # /var/lib/rancher/rke2/server/tls/client-ca.key,
    # /var/lib/rancher/rke2/server/tls/etcd/server-ca.key
    # newer than datastore and could cause a cluster outage.
    # Remove the file(s) from disk and restart to be recreated from datastore."
    #
    # - name: Remove TLS CAs and credentials
    #   ansible.builtin.file:
    #     path: "{{ item }}"
    #     state: absent
    #   loop:
    #     - /var/lib/rancher/rke2/server/tls/server-ca.crt
    #     - /var/lib/rancher/rke2/server/tls/server-ca.key
    #     - /var/lib/rancher/rke2/server/tls/client-ca.crt
    #     - /var/lib/rancher/rke2/server/tls/client-ca.key
    #     - /var/lib/rancher/rke2/server/tls/request-header-ca.crt
    #     - /var/lib/rancher/rke2/server/tls/request-header-ca.key
    #     - /var/lib/rancher/rke2/server/tls/service.key
    #     - /var/lib/rancher/rke2/server/tls/etcd/server-ca.crt
    #     - /var/lib/rancher/rke2/server/tls/etcd/server-ca.key
    #     - /var/lib/rancher/rke2/server/tls/etcd/peer-ca.crt
    #     - /var/lib/rancher/rke2/server/tls/etcd/peer-ca.key
    #     - /var/lib/rancher/rke2/server/cred/ipsec.psk
    #     - /var/lib/rancher/rke2/server/cred/encryption-config.json
    #     - /var/lib/rancher/rke2/server/cred/encryption-state.json

    - name: Start RKE2 service
      ansible.builtin.systemd_service:
        name: rke2-server
        state: started
        daemon_reload: true

    - name: Wait for API server
      ansible.builtin.wait_for:
        host: "{{ wireguard_ip }}"
        port: 6443
        sleep: 10
        timeout: 300

    - name: Wait for Ready status
      ansible.builtin.command:
        cmd: kubectl get node {{ inventory_hostname }} -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
      when: not ansible_check_mode
      register: node_ready
      until: node_ready.stdout == "True"
      retries: 40
      delay: 15
      changed_when: false

    - name: Add kubectl to path
      ansible.builtin.copy:
        content: |
          export PATH=$PATH:{{ rke2_bin_dir }}
        dest: /etc/profile.d/rke2.sh
        owner: root
        group: root
        mode: "0644"
      when: rke2_type == 'server'

    - name: Create user kube directory
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/.kube"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0700"
      when: rke2_type == 'server'

    - name: Write user kubeconfig file
      ansible.builtin.copy:
        src: "{{ rke2_kubeconfig }}"
        dest: "/home/{{ ansible_user }}/.kube/config"
        remote_src: true
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"
      when: rke2_type == 'server'

    - name: Get node status
      ansible.builtin.command:
        cmd: kubectl get nodes -o wide
      when: not ansible_check_mode
      register: node_status
      changed_when: false

    - name: Print node status
      ansible.builtin.debug:
        msg: "{{ node_status.stdout_lines }}"
