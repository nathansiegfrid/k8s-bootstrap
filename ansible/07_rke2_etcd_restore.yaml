---
# Restore etcd from an S3 snapshot.
#
# This playbook only targets the first master node.
# Worker nodes are left untouched and will reconnect to the restored cluster
# automatically once the API server is back up.
# The rest of the master nodes should join normally as fresh new nodes later.

- name: Restore etcd on first master node
  hosts: k8s_master_nodes[0]
  become: true
  vars:
    ansible_host: "{{ wireguard_ip }}"
    ansible_user: "{{ ssh_user }}"
    restore_log: /tmp/rke2-restore.log
    restore_timeout_seconds: 120

  environment:
    PATH: "{{ rke2_bin_dir }}:{{ ansible_env.PATH }}"
    KUBECONFIG: "{{ rke2_kubeconfig }}"

  tasks:
    - name: Validate that etcd_snapshot_name is provided
      ansible.builtin.fail:
        msg: >-
          etcd_snapshot_name is required.
          Usage: ansible-playbook 07_rke2_etcd_restore.yaml -e etcd_snapshot_name=<NAME>
      when: etcd_snapshot_name is not defined or etcd_snapshot_name | length == 0
      run_once: true

    - name: Confirm restore operation
      ansible.builtin.pause:
        prompt: >-
          WARNING: This will restore etcd from S3 snapshot '{{ etcd_snapshot_name }}'
          on host '{{ inventory_hostname }}' ({{ wireguard_ip }}).
          Type 'restore' to proceed
      register: confirmation
      run_once: true

    - name: Abort if confirmation was not given
      ansible.builtin.fail:
        msg: "Restore aborted by operator."
      when: confirmation.user_input != "restore"

    - name: Stop RKE2 server service
      ansible.builtin.systemd_service:
        name: rke2-server
        state: stopped
      failed_when: false

    - name: Create RKE2 data directory
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ rke2_data_dir }}"

    - name: Create required directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - "{{ rke2_config_dir }}"
        - "{{ rke2_data_dir }}/agent/etc/kubelet.conf.d"
        - "{{ rke2_data_dir }}/server/manifests"
        - /var/log/kubernetes

    - name: Write RKE2 config
      ansible.builtin.template:
        src: rke2-config.yaml.j2
        dest: "{{ rke2_config_dir }}/config.yaml"
        owner: root
        group: root
        mode: "0600"

    - name: Write kubelet drop-in config
      ansible.builtin.copy:
        src: kubelet-config.yaml
        dest: "{{ rke2_data_dir }}/agent/etc/kubelet.conf.d/99-custom.yaml"
        owner: root
        group: root
        mode: "0600"

    - name: Write audit policy
      ansible.builtin.copy:
        src: audit-policy.yaml
        dest: "{{ rke2_config_dir }}/audit-policy.yaml"
        owner: root
        group: root
        mode: "0600"
      when: rke2_type == 'server'

    - name: Write PSA config
      ansible.builtin.copy:
        src: rke2-psa-config.yaml
        dest: "{{ rke2_config_dir }}/rke2-psa-config.yaml"
        owner: root
        group: root
        mode: "0600"
      when: rke2_type == 'server'

    - name: Write Cilium HelmChartConfig
      ansible.builtin.copy:
        src: rke2-cilium-config.yaml
        dest: "{{ rke2_data_dir }}/server/manifests/rke2-cilium-config.yaml"
        owner: root
        group: root
        mode: "0600"
      when: rke2_type == 'server'

    - name: Write Cilium host firewall config
      ansible.builtin.template:
        src: rke2-host-firewall.yaml.j2
        dest: "{{ rke2_data_dir }}/server/manifests/rke2-host-firewall.yaml"
        owner: root
        group: root
        mode: "0600"
      when: rke2_type == 'server'

    - name: Install RKE2
      ansible.builtin.shell:
        cmd: curl -sfL https://get.rke2.io | sh -
      environment:
        INSTALL_RKE2_VERSION: "{{ rke2_version }}"
        INSTALL_RKE2_TYPE: "{{ rke2_type }}"
      args:
        creates: /usr/local/bin/rke2
      when: not ansible_check_mode

    # Host requirements for CIS hardening
    # https://docs.rke2.io/security/hardening_guide

    - name: Create system user for etcd
      ansible.builtin.user:
        name: etcd
        shell: /sbin/nologin
        create_home: no
        system: yes
      when:
        - rke2_type == 'server'

    - name: Copy RKE2 CIS sysctl config file
      ansible.builtin.copy:
        remote_src: true
        src: /usr/local/share/rke2/rke2-cis-sysctl.conf
        dest: /etc/sysctl.d/60-rke2-cis.conf
        owner: root
        group: root
        mode: "0644"
      register: sysctl_config

    - name: Restart systemd-sysctl
      ansible.builtin.systemd_service:
        name: systemd-sysctl
        state: restarted
      when:
        - sysctl_config is changed

    - name: Run etcd cluster-reset restore from S3 snapshot
      ansible.builtin.shell:
        cmd: rke2 server --cluster-reset --cluster-reset-restore-path={{ etcd_snapshot_name }} > {{ restore_log }} 2>&1
      environment:
        INSTALL_RKE2_VERSION: "{{ rke2_version }}"
        INSTALL_RKE2_TYPE: "{{ rke2_type }}"
      when: not ansible_check_mode

    # NOTE: Below is the old task version using workarounds to
    # break infinite "Failed to test etcd connection" loop.
    #
    # - name: Run etcd cluster-reset restore from S3 snapshot
    #   ansible.builtin.shell: |
    #     rm -f {{ restore_log }}
