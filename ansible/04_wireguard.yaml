---
# Deploy a full-mesh WireGuard VPN between all nodes.
#
# Nodes may live on different providers with no shared private network.
# WireGuard creates encrypted tunnels so inter-node traffic stays private.

- name: Deploy WireGuard mesh VPN
  hosts: k8s_nodes
  become: true
  vars:
    ansible_user: "{{ ssh_user }}"

  tasks:
    - name: Install WireGuard
      ansible.builtin.apt:
        name:
          - iptables
          - wireguard
          - wireguard-tools
        state: present
        update_cache: true

    - name: Load WireGuard kernel module
      community.general.modprobe:
        name: wireguard
        state: present

    - name: Persist WireGuard kernel module across reboots
      ansible.builtin.copy:
        dest: /etc/modules-load.d/wireguard.conf
        content: "wireguard\n"
        mode: "0644"

    - name: Create WireGuard config directory
      ansible.builtin.file:
        path: "{{ wireguard_dir }}"
        state: directory
        mode: "0700"

    - name: Check if private key already exists
      ansible.builtin.stat:
        path: "{{ wireguard_dir }}/private.key"
      register: wg_private_key_file

    - name: Generate WireGuard private key
      ansible.builtin.shell:
        cmd: "wg genkey > {{ wireguard_dir }}/private.key"
      args:
        creates: "{{ wireguard_dir }}/private.key"
      when:
        - not wg_private_key_file.stat.exists
        - not ansible_check_mode

    - name: Set private key file permissions
      ansible.builtin.file:
        path: "{{ wireguard_dir }}/private.key"
        mode: "0600"

    - name: Generate WireGuard public key
      ansible.builtin.shell:
        cmd: "wg pubkey < {{ wireguard_dir }}/private.key > {{ wireguard_dir }}/public.key"
      args:
        creates: "{{ wireguard_dir }}/public.key"

    - name: Read private key
      ansible.builtin.slurp:
        src: "{{ wireguard_key_dir }}/private.key"
      register: wg_private_key

    - name: Read public key
      ansible.builtin.slurp:
        src: "{{ wireguard_dir }}/public.key"
      register: wg_public_key

    - name: Store keys as host facts
      ansible.builtin.set_fact:
        wireguard_private_key: "{{ wg_private_key.content | b64decode | trim }}"
        wireguard_public_key: "{{ wg_public_key.content | b64decode | trim }}"

    - name: Stop existing WireGuard interface
      ansible.builtin.command:
        cmd: "wg-quick down {{ wireguard_interface }}"
      when: not ansible_check_mode
      failed_when: false
      changed_when: false

    - name: Write WireGuard interface config
      ansible.builtin.template:
        src: wireguard.conf.j2
        dest: "{{ wireguard_dir }}/{{ wireguard_interface }}.conf"
        owner: root
        group: root
        mode: "0600"

    - name: Enable and start WireGuard interface
      ansible.builtin.systemd_service:
        name: "wg-quick@{{ wireguard_interface }}"
        state: restarted
        enabled: true
        daemon_reload: true

    - name: Show WireGuard status
      ansible.builtin.command:
        cmd: "wg show {{ wireguard_interface }}"
      register: wg_status
      delay: 5
      retries: 3
      changed_when: false

    - name: Print WireGuard status
      ansible.builtin.debug:
        msg: "{{ wg_status.stdout_lines }}"

    - name: Ping all peers over WireGuard
      ansible.builtin.command:
        cmd: "ping -c 3 -W 5 {{ hostvars[item].wireguard_ip }}"
      loop: "{{ groups['k8s_nodes'] | difference([inventory_hostname]) }}"
      register: ping_results
      changed_when: false

    - name: Print peer connectivity results
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} -> {{ item.item }} ({{ hostvars[item.item].wireguard_ip }}): OK"
      loop: "{{ ping_results.results }}"
      loop_control:
        label: "{{ item.item }}"
